<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>充值中心 - 管理后台</title>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 外部样式 -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="header" id="adminHeader" style="display:none;">
    <span class="header-title">🛡️ 管理后台</span>
    <button class="header-btn danger" onclick="logout()">退出登录</button>
</header>

<!-- ===== 主内容 ===== -->
<main class="main">

    <!-- ==================== 登录页 ==================== -->
    <section class="page-section active" id="loginPage">
        <div class="login-container">
            <div class="login-logo">🛡️</div>
            <h1 class="login-title">管理员登录</h1>
            <div class="login-card">
                <input type="text" class="login-input" id="loginUser" placeholder="管理员账号" autocomplete="username">
                <input type="password" class="login-input" id="loginPass" placeholder="登录密码" autocomplete="current-password">
                <button class="login-btn" onclick="doLogin()">登 录</button>
                <p class="login-error" id="loginError">账号或密码错误！</p>
                <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:16px;">
                    默认账号：admin &nbsp; 密码：admin123
                </p>
            </div>
        </div>
    </section>

    <!-- ==================== 后台主页 ==================== -->
    <div id="dashboardArea" style="display:none;">

        <!-- 订单管理 Tab -->
        <section class="page-section active has-tabbar" id="tabOrders">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总订单</div></div>
                <div class="stat-card"><div class="stat-num" id="statPending" style="color:#d97706;">0</div><div class="stat-label">待审核</div></div>
                <div class="stat-card"><div class="stat-num" id="statApproved" style="color:#16a34a;">0</div><div class="stat-label">已通过</div></div>
            </div>

            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索手机号/订单号/代金券...">
                <button class="search-btn" onclick="searchOrders()">🔍 搜索</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">📋 订单列表</h2>
                    <span class="card-badge" id="orderCount">0 条</span>
                </div>
                <div class="order-list" id="orderList">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 系统设置 Tab -->
        <section class="page-section has-tabbar" id="tabSettings">
            <div class="card">
                <div class="card-header"><h2 class="card-title">⚙️ 系统设置</h2></div>

                <div class="setting-group" style="background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:12px;padding:12px;">
                    <label class="setting-label">🚦 暂停访问（维护模式）</label>
                    <select class="setting-input" id="setMaintenance">
                        <option value="">正常营业（用户可正常充值）</option>
                        <option value="on">暂停访问（前台显示维护页）</option>
                    </select>
                    <p style="font-size:12px;color:#9a3412;margin-top:6px;">开启后，所有用户打开前台都会看到"暂停服务中"，无法充值。需要时再改回"正常营业"即可恢复。</p>
                </div>

                <div class="setting-group">
                    <label class="setting-label">🏷️ 网站名称</label>
                    <input type="text" class="setting-input" id="setSiteName" placeholder="例如：充值中心">
                </div>
                <div class="setting-group">
                    <label class="setting-label">📢 首页公告</label>
                    <textarea class="setting-textarea" id="setNotice" placeholder="输入首页公告文字..."></textarea>
                </div>
                <div class="setting-group">
                    <label class="setting-label">🎉 Banner文案</label>
                    <input type="text" class="setting-input" id="setBanner" placeholder="例如：🎉 品牌充值 · 代金券限时领">
                </div>
                <div class="setting-group">
                    <label class="setting-label">💚 微信收款码</label>
                    <div class="qr-upload-area" onclick="document.getElementById('fileWechat').click()">
                        <span style="font-size:32px;">📷</span>
                        <p style="font-size:13px;color:#64748b;margin-top:4px;" id="wechatUploadText">点击上传微信收款码图片</p>
                        <img class="qr-preview-img" id="previewWechat" alt="微信收款码预览">
                        <input type="file" id="fileWechat" style="display:none;" accept="image/*"
                            onchange="previewQr(this,'previewWechat','wechatUploadText')">
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">💙 支付宝收款码</label>
                    <div class="qr-upload-area" onclick="document.getElementById('fileAlipay').click()">
                        <span style="font-size:32px;">📷</span>
                        <p style="font-size:13px;color:#64748b;margin-top:4px;" id="alipayUploadText">点击上传支付宝收款码图片</p>
                        <img class="qr-preview-img" id="previewAlipay" alt="支付宝收款码预览">
                        <input type="file" id="fileAlipay" style="display:none;" accept="image/*"
                            onchange="previewQr(this,'previewAlipay','alipayUploadText')">
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">💬 客服名称</label>
                    <input type="text" class="setting-input" id="setKefuName" placeholder="例如：在线客服小助手">
                </div>
                <div class="setting-group">
                    <label class="setting-label">🔗 客服转跳链接</label>
                    <input type="text" class="setting-input" id="setKefuLink" placeholder="例如：客服系统/微信客服/企业微信链接">
                    <p style="font-size:12px;color:#9ca3af;margin-top:6px;">填了之后，用户点"联系在线客服"会直接转跳到这个链接；留空则展示内置客服页。</p>
                </div>
                <button class="save-btn" onclick="saveSettings()">💾 保存所有设置</button>
            </div>

            <div class="card">
                <div class="card-header"><h2 class="card-title">🔐 修改管理员密码</h2></div>
                <div class="setting-group">
                    <label class="setting-label">当前密码</label>
                    <input type="password" class="setting-input" id="oldPass" placeholder="输入当前密码">
                </div>
                <div class="setting-group">
                    <label class="setting-label">新密码</label>
                    <input type="password" class="setting-input" id="newPass" placeholder="输入新密码">
                </div>
                <div class="setting-group">
                    <label class="setting-label">确认新密码</label>
                    <input type="password" class="setting-input" id="confirmPass" placeholder="再次输入新密码">
                </div>
                <button class="save-btn" style="background:linear-gradient(135deg,#6366f1,#4f46e5);" onclick="changePassword()">
                    🔑 修改密码
                </button>
            </div>
        </section>
    </div>

</main>

<!-- ===== 底部导航 ===== -->
<nav class="tab-bar" id="tabBar" style="display:none;">
    <button class="tab-item active" onclick="switchTab('orders')">
        <span class="tab-icon">📋</span><span class="tab-name">订单管理</span>
    </button>
    <button class="tab-item" onclick="switchTab('settings')">
        <span class="tab-icon">⚙️</span><span class="tab-name">系统设置</span>
    </button>
</nav>

<!-- ===== 订单详情弹窗 ===== -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <h3 class="modal-title">订单详情</h3>
        <div id="modalDetailBody"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 外部脚本 -->
<script src="js/admin.js"></script>

</body>
</html>
