<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>油卡充值</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            color: #fff;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .amount-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .amount-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .amount-item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .amount-value {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }
        .amount-desc {
            font-size: 12px;
            color: #666;
        }
        .amount-coupon {
            font-size: 11px;
            color: #e74c3c;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            margin-top: 12px;
        }
        .upload-area {
            border: 2px dashed #d0d0d0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .upload-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 12px;
        }
        .upload-text {
            font-size: 14px;
            color: #666;
        }
        .upload-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .notice {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
        }
        .step-dot.active {
            background: #667eea;
            width: 24px;
            border-radius: 4px;
        }
        .hidden {
            display: none;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .summary-row:last-child {
            border-bottom: none;
            font-weight: 600;
            color: #e74c3c;
        }
        .qrcode-img {
            width: 100%;
            max-width: 200px;
            margin: 0 auto 16px;
            display: block;
            border-radius: 8px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛽ 油卡充值</h1>
            <p>官方充值服务 | 安全稳定</p>
        </div>

        <div class="step-indicator">
            <div class="step-dot active" data-step="1"></div>
            <div class="step-dot" data-step="2"></div>
            <div class="step-dot" data-step="3"></div>
            <div class="step-dot" data-step="4"></div>
        </div>

        <!-- 第一步：填写信息 -->
        <div class="card" id="step1">
            <h2 class="card-title">📝 填写信息</h2>
            <div class="notice">
                📌 提示：充值前请先领取电子代金券，可抵扣部分金额
            </div>
            <div class="form-group">
                <label class="form-label">手机号码</label>
                <input type="tel" class="form-input" id="phoneInput" placeholder="请输入11位手机号" maxlength="11">
            </div>
            <button class="btn btn-primary" id="claimBtn" onclick="claimCoupon()">领取代金券</button>
            <div id="couponStatus" style="margin-top:12px;text-align:center;font-size:14px;color:#28a745;"></div>
            <button class="btn btn-secondary hidden" id="nextBtn1" onclick="goStep(2)">下一步 →</button>
        </div>

        <!-- 第二步：选择金额 -->
        <div class="card hidden" id="step2">
            <h2 class="card-title">💰 选择充值金额</h2>
            <div class="amount-grid">
                <div class="amount-item" data-amount="300" onclick="selectAmount(this)">
                    <div class="amount-value">¥300</div>
                    <div class="amount-desc">实付¥255</div>
                    <div class="amount-coupon">送¥45</div>
                </div>
                <div class="amount-item" data-amount="500" onclick="selectAmount(this)">
                    <div class="amount-value">¥500</div>
                    <div class="amount-desc">实付¥425</div>
                    <div class="amount-coupon">送¥75</div>
                </div>
                <div class="amount-item" data-amount="1000" onclick="selectAmount(this)">
                    <div class="amount-value">¥1000</div>
                    <div class="amount-desc">实付¥850</div>
                    <div class="amount-coupon">送¥150</div>
                </div>
                <div class="amount-item" data-amount="2000" onclick="selectAmount(this)">
                    <div class="amount-value">¥2000</div>
                    <div class="amount-desc">实付¥1700</div>
                    <div class="amount-coupon">送¥300</div>
                </div>
            </div>
            <div id="orderSummary" style="margin-bottom:16px;">
                <div class="summary-row">
                    <span>充值金额</span>
                    <span id="sumAmount">¥300</span>
                </div>
                <div class="summary-row">
                    <span>代金券抵扣</span>
                    <span style="color:#28a745;">-¥45</span>
                </div>
                <div class="summary-row">
                    <span>实付金额</span>
                    <span id="sumPay" style="color:#e74c3c;font-size:18px;">¥255</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="goStep(3)">下一步 →</button>
        </div>

        <!-- 第三步：支付 -->
        <div class="card hidden" id="step3">
            <h2 class="card-title">💳 扫码支付</h2>
            <div style="text-align:center;margin-bottom:16px;">
                <img src="https://via.placeholder.com/200x200/667eea/ffffff?text=微信支付" class="qrcode-img" alt="收款码">
                <p style="font-size:14px;color:#666;">请使用微信扫码支付</p>
            </div>
            <div class="form-group">
                <label class="form-label">上传付款截图</label>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击上传付款凭证</div>
                    <img id="previewImg" class="upload-preview hidden">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewFile(this)">
            </div>
            <button class="btn btn-primary" id="submitBtn" onclick="submitOrder()">我已支付，提交充值</button>
        </div>

        <!-- 第四步：结果 -->
        <div class="card hidden" id="step4">
            <div style="text-align:center;padding:40px 0;">
                <div style="font-size:80px;margin-bottom:20px;">✅</div>
                <h2 style="font-size:24px;font-weight:700;margin-bottom:10px;">充值成功！</h2>
                <p style="color:#666;margin-bottom:20px;">订单已提交，请耐心等待处理</p>
                <div style="background:#f8f9fa;padding:16px;border-radius:8px;margin-bottom:20px;">
                    <p style="font-size:13px;color:#666;margin-bottom:4px;">订单编号</p>
                    <p id="orderId" style="font-size:16px;font-weight:600;font-family:monospace;">ORD20260805123456</p>
                </div>
                <button class="btn btn-primary" onclick="location.reload()">返回首页</button>
            </div>
        </div>

        <div class="footer">
            © 2026 油卡充值平台 · 安全可信
        </div>
    </div>

    <script>
        let currentStep = 1;
        let selectedAmount = 300;
        let couponCode = '';
        let uploadedFile = null;
        let phone = '';

        const amountData = {
            300: { coupon: 45, pay: 255 },
            500: { coupon: 75, pay: 425 },
            1000: { coupon: 150, pay: 850 },
            2000: { coupon: 300, pay: 1700 }
        };

        function goStep(step) {
            document.querySelectorAll('[id^="step"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('step' + step).classList.remove('hidden');
            
            document.querySelectorAll('.step-dot').forEach(dot => {
                dot.classList.remove('active');
                if (parseInt(dot.dataset.step) <= step) dot.classList.add('active');
            });
            
            currentStep = step;
            window.scrollTo(0, 0);
        }

        function claimCoupon() {
            phone = document.getElementById('phoneInput').value.trim();
            if (!phone || phone.length !== 11) {
                alert('请输入正确的11位手机号');
                return;
            }
            
            couponCode = 'COUPON' + Date.now().toString().slice(-6);
            document.getElementById('couponStatus').textContent = '✅ 代金券已领取：' + couponCode;
            document.getElementById('claimBtn').classList.add('hidden');
            document.getElementById('nextBtn1').classList.remove('hidden');
        }

        function selectAmount(el) {
            document.querySelectorAll('.amount-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedAmount = parseInt(el.dataset.amount);
            
            const data = amountData[selectedAmount];
            document.getElementById('sumAmount').textContent = '¥' + selectedAmount;
            document.getElementById('sumPay').textContent = '¥' + data.pay;
        }

        function previewFile(input) {
            if (input.files && input.files[0]) {
                uploadedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('previewImg');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.querySelector('.upload-icon').style.display = 'none';
                    document.querySelector('.upload-text').textContent = '✅ 已选择图片';
                };
                reader.readAsDataURL(uploadedFile);
            }
        }

        function submitOrder() {
            if (!uploadedFile) {
                alert('请上传付款截图');
                return;
            }
            
            // 模拟提交
            setTimeout(() => {
                goStep(4);
            }, 1000);
        }

        // 初始化
        selectAmount(document.querySelector('.amount-item'));
    </script>
</body>
</html>
