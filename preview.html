<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油卡充值 - 前台预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .phone-preview {
            max-width: 390px;
            margin: 0 auto;
            background: #f5f5f7;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            min-height: 844px;
            position: relative;
        }
        .status-bar {
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        .content {
            padding: 20px 16px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            color: #fff;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .amount-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .amount-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .amount-item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .amount-value {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }
        .amount-desc {
            font-size: 12px;
            color: #666;
        }
        .amount-coupon {
            font-size: 11px;
            color: #e74c3c;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            margin-top: 12px;
        }
        .upload-area {
            border: 2px dashed #d0d0d0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: #fafafa;
        }
        .upload-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 12px;
        }
        .upload-text {
            font-size: 14px;
            color: #666;
        }
        .notice {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .summary-row:last-child {
            border-bottom: none;
            font-weight: 600;
            color: #e74c3c;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
        .demo-note {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="phone-preview">
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>
        
        <div class="header">
            <h1>⛽ 油卡充值</h1>
            <p>官方充值服务 | 安全稳定</p>
        </div>
        
        <div class="content">
            <!-- 第一步 -->
            <div class="card" id="step1">
                <h2 class="card-title">📝 填写信息</h2>
                <div class="notice">
                    📌 提示：充值前请先领取电子代金券，可抵扣部分金额
                </div>
                <div class="form-group">
                    <label class="form-label">手机号码</label>
                    <input type="tel" class="form-input" placeholder="请输入11位手机号" value="13800138000">
                </div>
                <button class="btn btn-primary">领取代金券</button>
                <button class="btn btn-secondary">下一步 →</button>
            </div>
            
            <!-- 第二步 -->
            <div class="card" id="step2" style="display:none">
                <h2 class="card-title">💰 选择充值金额</h2>
                <div class="amount-grid">
                    <div class="amount-item selected">
                        <div class="amount-value">¥300</div>
                        <div class="amount-desc">实付¥255</div>
                        <div class="amount-coupon">送¥45</div>
                    </div>
                    <div class="amount-item">
                        <div class="amount-value">¥500</div>
                        <div class="amount-desc">实付¥425</div>
                        <div class="amount-coupon">送¥75</div>
                    </div>
                    <div class="amount-item">
                        <div class="amount-value">¥1000</div>
                        <div class="amount-desc">实付¥850</div>
                        <div class="amount-coupon">送¥150</div>
                    </div>
                    <div class="amount-item">
                        <div class="amount-value">¥2000</div>
                        <div class="amount-desc">实付¥1700</div>
                        <div class="amount-coupon">送¥300</div>
                    </div>
                </div>
                <div id="orderSummary">
                    <div class="summary-row">
                        <span>充值金额</span>
                        <span>¥300</span>
                    </div>
                    <div class="summary-row">
                        <span>代金券抵扣</span>
                        <span style="color:#28a745;">-¥45</span>
                    </div>
                    <div class="summary-row">
                        <span>实付金额</span>
                        <span style="color:#e74c3c;font-size:18px;">¥255</span>
                    </div>
                </div>
                <button class="btn btn-primary">下一步 →</button>
            </div>
            
            <!-- 第三步 -->
            <div class="card" id="step3" style="display:none">
                <h2 class="card-title">💳 扫码支付</h2>
                <div style="text-align:center;margin-bottom:16px;">
                    <div style="width:200px;height:200px;background:#f0f0f0;margin:0 auto 12px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#999;">
                        [收款码图片]
                    </div>
                    <p style="font-size:14px;color:#666;">请使用微信扫码支付</p>
                </div>
                <div class="form-group">
                    <label class="form-label">上传付款截图</label>
                    <div class="upload-area">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击上传付款凭证</div>
                    </div>
                </div>
                <button class="btn btn-primary">我已支付，提交充值</button>
            </div>
            
            <div class="demo-note">
                💡 这是前台预览，点击按钮可切换步骤查看效果
            </div>
        </div>
        
        <div class="footer">
            © 2026 油卡充值平台 · 安全可信
        </div>
    </div>
    
    <script>
        // 演示交互
        document.querySelectorAll('.btn-primary')[0].onclick = function() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        };
        
        document.querySelectorAll('.btn-secondary')[0].onclick = function() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        };
        
        document.querySelectorAll('.btn-primary')[1].onclick = function() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        };
        
        document.querySelectorAll('.amount-item').forEach(item => {
            item.onclick = function() {
                document.querySelectorAll('.amount-item').forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
            };
        });
    </script>
</body>
</html>
