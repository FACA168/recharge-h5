<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传测试</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    #preview { max-width: 200px; margin-top: 10px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>图片上传测试</h2>
  <div id="status"></div>
  
  <h3>测试1: 选择图片并预览</h3>
  <input type="file" id="fileInput" accept="image/*">
  <img id="preview" style="display:none;">
  
  <h3>测试2: 直接上传到Supabase</h3>
  <button onclick="testUpload()">测试上传</button>
  <button onclick="clearLog()">清空日志</button>
  
  <h3>日志</h3>
  <pre id="log" style="background:#f5f5f5; padding:10px; max-height:300px; overflow-y:auto;"></pre>

  <script>
    const SUPABASE_URL = 'https://unytaslvyaytlqdmwavm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVueXRhc2x2eWF5dGxxZG13YXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTY4NTIsImV4cCI6MjEwMDU3Mjg1Mn0.lU5OU0tWSzeYPiBWskH1jJ83BvgOEeCFm8DAYNLUET0';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'test-result ' + type;
      entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }
    
    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }
    
    // 测试1: 文件选择和预览
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      log('选择文件: ' + file?.name + ', 大小: ' + file?.size + ' bytes');
      
      if (!file) {
        log('没有选择文件', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64 = event.target.result;
        log('读取成功，base64长度: ' + base64.length);
        
        const preview = document.getElementById('preview');
        preview.src = base64;
        preview.style.display = 'block';
        log('预览已显示', 'success');
      };
      reader.onerror = function(e) {
        log('读取失败: ' + e.target.error.message, 'error');
      };
      reader.readAsDataURL(file);
    });
    
    // 测试2: 上传到Supabase
    async function testUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        log('请先选择图片', 'error');
        return;
      }
      
      log('开始上传...');
      
      try {
        const fileName = 'test_' + Date.now() + '_' + file.name;
        log('上传到: screenshots/' + fileName);
        
        const { data, error } = await supabase.storage
          .from('screenshots')
          .upload(fileName, file, { upsert: false });
        
        if (error) {
          log('上传失败: ' + error.message, 'error');
          console.error(error);
          return;
        }
        
        log('上传成功！', 'success');
        log('数据: ' + JSON.stringify(data));
        
        // 获取公开URL
        const { data: urlData } = supabase.storage
          .from('screenshots')
          .getPublicUrl(fileName);
        
        log('公开URL: ' + urlData.publicUrl, 'success');
        
      } catch (e) {
        log('上传异常: ' + e.message, 'error');
        console.error(e);
      }
    }
    
    // 页面加载时检查连接
    window.onload = function() {
      log('页面加载完成');
      log('Supabase URL: ' + SUPABASE_URL);
    };
  </script>
</body>
</html>
